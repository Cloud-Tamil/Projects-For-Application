<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <nav>

        <div class="logo">
            Product Store
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products-page">
                Products
            </a>

            <a href="/docs">
                API Docs
            </a>

        </div>

    </nav>


    <main class="container">

        <h1>Products</h1>

        <div class="product-grid">

            {% for product in products %}

            <div class="card">

                <div class="product-icon">
                    🛍️
                </div>

                <h2>
                    {{ product.name }}
                </h2>

                <p>
                    Product ID:
                    {{ product.id }}
                </p>

                <p class="price">
                    ₹{{ "{:,.2f}".format(product.price) }}
                </p>

                <a
                    class="button"
                    href="/product/{{ product.id }}"
                >
                    View Details
                </a>

            </div>

            {% endfor %}

        </div>

    </main>


    <footer>

        <p>
            Product Microservice
        </p>

    </footer>

</body>

</html>
