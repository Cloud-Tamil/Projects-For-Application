<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <nav>

        <div class="logo">
            Product Store
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/products-page">
                Products
            </a>

            <a href="/docs">
                API Docs
            </a>

        </div>

    </nav>


    <main class="product-detail">

        <div class="product-image">

            🛒

        </div>


        <div class="product-info">

            <h1>
                {{ product.name }}
            </h1>

            <p>
                Product ID:
                {{ product.id }}
            </p>

            <h2 class="price">

                ₹{{ "{:,.2f}".format(product.price) }}

            </h2>

            <p>
                This product is available
                through our Product Microservice.
            </p>

            <a
                class="button"
                href="/products-page"
            >
                Back to Products
            </a>

        </div>

    </main>


    <footer>

        <p>
            Product Microservice
        </p>

    </footer>

</body>

</html>
