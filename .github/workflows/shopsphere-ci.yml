name: ShopSphere CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Shopsphere-Microservices-Application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Shopsphere-Microservices-Application/package.json

      - name: Validate JavaScript syntax
        run: |
          node --check gateway/server.js
          node --check services/common.js
          node --check services/auth/server.js
          node --check services/product/server.js
          node --check services/cart/server.js
          node --check services/order/server.js
          node --check services/payment/server.js

      - name: Run structural tests
        run: npm test

      - name: Build Docker images
        run: docker compose build

      - name: Start ShopSphere
        run: docker compose up -d

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:18080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run end-to-end smoke test
        run: npm run test:smoke

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
