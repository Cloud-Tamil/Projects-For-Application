services:

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile

    container_name: shopsphere-gateway

    ports:
      - "18080:18080"

    environment:
      PORT: 18080
      JWT_SECRET: shopsphere-local-secret

      AUTH_URL: http://auth-service:4001
      PRODUCT_URL: http://product-service:4002
      CART_URL: http://cart-service:4003
      ORDER_URL: http://order-service:4004
      PAYMENT_URL: http://payment-service:4005

    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:18080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  auth-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: auth

    container_name: shopsphere-auth

    environment:
      PORT: 4001
      JWT_SECRET: shopsphere-local-secret
      DATA_DIR: /app/data

    volumes:
      - ./data/auth:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  product-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: product

    container_name: shopsphere-product

    environment:
      PORT: 4002
      DATA_DIR: /app/data

    volumes:
      - ./data/product:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  cart-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: cart

    container_name: shopsphere-cart

    environment:
      PORT: 4003
      JWT_SECRET: shopsphere-local-secret
      PRODUCT_URL: http://product-service:4002
      DATA_DIR: /app/data

    volumes:
      - ./data/cart:/app/data

    depends_on:
      product-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  order-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: order

    container_name: shopsphere-order

    environment:
      PORT: 4004
      JWT_SECRET: shopsphere-local-secret

      PRODUCT_URL: http://product-service:4002
      PAYMENT_URL: http://payment-service:4005

      DATA_DIR: /app/data

    volumes:
      - ./data/order:/app/data

    depends_on:
      product-service:
        condition: service_healthy

      payment-service:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  payment-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: payment

    container_name: shopsphere-payment

    environment:
      PORT: 4005
      JWT_SECRET: shopsphere-local-secret
      DATA_DIR: /app/data

    volumes:
      - ./data/payment:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
