<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>ShopSphere</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        input {
            margin: 4px;
            padding: 10px;
        }

        button {
            margin: 4px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: green;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            overflow: auto;
        }

    </style>

</head>


<body>


<h1>🛒 ShopSphere</h1>


<!-- ===================================================== -->
<!-- AUTH -->
<!-- ===================================================== -->

<section id="auth">

    <h2>Login / Register</h2>

    <input
        id="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <input
        id="name"
        placeholder="Name"
    >

    <br>

    <button onclick="registerUser()">
        Register
    </button>

    <button onclick="loginUser()">
        Login
    </button>

    <p id="message"></p>

</section>


<!-- ===================================================== -->
<!-- APPLICATION -->
<!-- ===================================================== -->

<section id="app" hidden>

    <h2>ShopSphere</h2>

    <button onclick="showProducts()">
        Products
    </button>

    <button onclick="showCart()">
        Cart
    </button>

    <button onclick="showOrders()">
        Orders
    </button>

    <button onclick="logout()">
        Logout
    </button>

    <hr>

    <div id="output"></div>

</section>


<script>


// ============================================================
// STATE
// ============================================================

let token =
    localStorage.getItem(
        "shopsphere_token"
    ) || "";


const authSection =
    document.getElementById(
        "auth"
    );


const appSection =
    document.getElementById(
        "app"
    );


const output =
    document.getElementById(
        "output"
    );


const message =
    document.getElementById(
        "message"
    );


// ============================================================
// UI
// ============================================================

function setLoggedIn(value) {

    authSection.hidden =
        !value;

    appSection.hidden =
        !value;
}


// ============================================================
// HEADERS
// ============================================================

function headers() {

    return {

        "Authorization":
            "Bearer " + token,

        "Content-Type":
            "application/json"
    };
}


// ============================================================
// API
// ============================================================

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            options
        );


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if (!response.ok) {

        throw new Error(
            data.error ||
            `HTTP ${response.status}`
        );
    }


    return data;
}


// ============================================================
// REGISTER
// ============================================================

async function registerUser() {

    try {

        await api(
            "/api/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        email:
                            document
                                .getElementById(
                                    "email"
                                )
                                .value,

                        password:
                            document
                                .getElementById(
                                    "password"
                                )
                                .value,

                        name:
                            document
                                .getElementById(
                                    "name"
                                )
                                .value
                    })
            }
        );


        message.className =
            "success";


        message.textContent =
            "Registration successful. Login now.";

    } catch (error) {

        message.className =
            "error";

        message.textContent =
            error.message;
    }
}


// ============================================================
// LOGIN
// ============================================================

async function loginUser() {

    try {

        const result =
            await api(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:
                                document
                                    .getElementById(
                                        "email"
                                    )
                                    .value,

                            password:
                                document
                                    .getElementById(
                                        "password"
                                    )
                                    .value
                        })
                }
            );


        token =
            result.token;


        localStorage.setItem(
            "shopsphere_token",
            token
        );


        setLoggedIn(
            true
        );


        showProducts();

    } catch (error) {

        message.className =
            "error";

        message.textContent =
            error.message;
    }
}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    token = "";

    localStorage.removeItem(
        "shopsphere_token"
    );

    setLoggedIn(
        false
    );
}


// ============================================================
// PRODUCTS
// ============================================================

async function showProducts() {

    try {

        const products =
            await api(
                "/api/products"
            );


        output.innerHTML =
            "<h2>Products</h2>" +

            products.map(
                product => `

                    <div class="card">

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            Price:
                            $${product.price.toFixed(2)}
                        </p>

                        <p>
                            Stock:
                            ${product.stock}
                        </p>

                        <button
                            onclick="addToCart('${product.id}')"
                        >
                            Add to Cart
                        </button>

                    </div>

                `
            ).join("");

    } catch (error) {

        output.innerHTML =
            `<p class="error">
                ${error.message}
            </p>`;
    }
}


// ============================================================
// ADD CART
// ============================================================

async function addToCart(
    productId
) {

    try {

        await api(
            "/api/cart/items",
            {
                method: "POST",

                headers:
                    headers(),

                body:
                    JSON.stringify({

                        productId,

                        quantity: 1
                    })
            }
        );


        alert(
            "Product added to cart"
        );

    } catch (error) {

        alert(
            error.message
        );
    }
}


// ============================================================
// CART
// ============================================================

async function showCart() {

    try {

        const cart =
            await api(
                "/api/cart",
                {
                    headers:
                        headers()
                }
            );


        output.innerHTML = `

            <h2>
                Cart
            </h2>

            <pre>
${JSON.stringify(
    cart,
    null,
    2
)}
            </pre>

            <button
                onclick="checkout()"
            >
                Checkout
            </button>
        `;

    } catch (error) {

        output.innerHTML =
            `<p class="error">
                ${error.message}
            </p>`;
    }
}


// ============================================================
// CHECKOUT
// ============================================================

async function checkout() {

    try {

        const cart =
            await api(
                "/api/cart",
                {
                    headers:
                        headers()
                }
            );


        if (
            !cart.items ||
            !cart.items.length
        ) {

            alert(
                "Cart is empty"
            );

            return;
        }


        const cardNumber =
            prompt(
                "Enter demo card number"
            );


        if (!cardNumber) {
            return;
        }


        const order =
            await api(
                "/api/orders",
                {
                    method: "POST",

                    headers:
                        headers(),

                    body:
                        JSON.stringify({

                            items:
                                cart.items,

                            cardNumber
                        })
                }
            );


        await api(
            "/api/cart",
            {
                method: "DELETE",

                headers:
                    headers()
            }
        );


        output.innerHTML = `

            <h2>
                Order Confirmed
            </h2>

            <pre>
${JSON.stringify(
    order,
    null,
    2
)}
            </pre>
        `;

    } catch (error) {

        alert(
            "Checkout failed: " +
            error.message
        );
    }
}


// ============================================================
// ORDERS
// ============================================================

async function showOrders() {

    try {

        const orders =
            await api(
                "/api/orders",
                {
                    headers:
                        headers()
                }
            );


        output.innerHTML = `

            <h2>
                Orders
            </h2>

            <pre>
${JSON.stringify(
    orders,
    null,
    2
)}
            </pre>
        `;

    } catch (error) {

        output.innerHTML =
            `<p class="error">
                ${error.message}
            </p>`;
    }
}


// ============================================================
// RESTORE LOGIN
// ============================================================

if (token) {

    setLoggedIn(
        true
    );

    showProducts();
}


</script>


</body>

</html>
